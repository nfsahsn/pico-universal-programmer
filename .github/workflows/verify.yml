name: Verify firmware and packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python tools/bootstrap.py --probes
      - run: python tools/bootstrap_arduino.py --cores
      - run: python tools/package_linux.py --cli .tools/arduino-cli/arduino-cli --arduino-data .tools/arduino
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-hardware-test-candidate
          path: |
            build/linux-candidate.tar.gz
            build/linux-candidate.tar.gz.sha256
          if-no-files-found: error
