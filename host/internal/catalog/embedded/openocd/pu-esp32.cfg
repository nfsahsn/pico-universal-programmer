# Phase 0 (spec §4.3, §9.1 S1): classic ESP32 over the programmer's CMSIS-DAP JTAG.
# The S1 loop and the stand-in debug shim add "adapter serial <SN>" before this file.
source [find interface/cmsis-dap.cfg]
transport select jtag
adapter speed 5000
# Holds TDI (MTDI/GPIO12) low while idle, so a reset still selects 3.3 V flash.
set ESP32_FLASH_VOLTAGE 3.3
source [find target/esp32.cfg]

# openocd-esp32's flasher stub calls esp_rom_spiflash_unlock() before every command, and on flash
# that does not keep Status Register 2 through that write (the S1 board's Zbit ZB25VQ32, JEDEC ID
# 5E 40 16) it clears the Quad Enable bit. An app reading flash in QIO mode, the Arduino ESP32
# default, then fetches garbage: the stub finds no flash mappings, and the app crashes when resumed,
# even inside the next reset halt (reset timeouts). The stock gdb-attach handler halts the running
# app and GDB's memory map request then probes the flash bank with the stub. Resetting first keeps
# the stub to the reset vector; the bootloader sets QE again before the app needs it. The IDE runs
# "monitor reset halt" right after attaching anyway.
$_TARGETNAME_0 configure -event gdb-attach "[$_TARGETNAME_0 cget -event gdb-attach]
    reset halt"

# When OpenOCD first finds the chip running, it halts each core to read its reset reason and allows
# 100 ms, but the register fetch on halt takes about 135 ms over this probe's CMSIS-DAP JTAG, so it
# logs a false "Timed out waiting for CPU to be reset" per core. Halting both cores once, after the
# last one is examined at startup, lets that read find them already halted.
set _PU_LAST_CORE [expr {$_ONLYCPU & 0x2 ? $_TARGETNAME_1 : $_TARGETNAME_0}]
$_PU_LAST_CORE configure -event examine-end "[$_PU_LAST_CORE cget -event examine-end]
    if {!\[info exists ::_PU_STARTUP_HALTED\]} { set ::_PU_STARTUP_HALTED 1; halt }"

# The IDE halts the chip before it detaches (cortex-debug's Stop), and openocd-esp32 resumes on
# detach only a chip that was running, so the sketch stayed halted after every Debug session until
# the next reset. The event fires on whichever core is GDB's current target.
proc _pu_resume_after_detach {} {
	if {[[target current] curstate] eq "halted"} { resume }
}
foreach _PU_CORE [lsort -unique [list $_TARGETNAME_0 $_PU_LAST_CORE]] {
	$_PU_CORE configure -event gdb-detach "[$_PU_CORE cget -event gdb-detach]
    _pu_resume_after_detach"
}
