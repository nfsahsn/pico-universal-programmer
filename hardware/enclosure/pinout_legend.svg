<svg xmlns="http://www.w3.org/2000/svg" width="550" height="240" viewBox="0 0 550 240">
  <rect x="2" y="2" width="546" height="236" rx="16" ry="16" fill="#111827" stroke="#e5e7eb" stroke-width="2"/>
  <text x="20" y="26" fill="#f9fafb" font-family="monospace" font-size="14" font-weight="bold">PICO UNIVERSAL PRO  |  1.8V - 5.0V  |  VID 0x2E8A</text>
  <line x1="18" y1="34" x2="532" y2="34" stroke="#4b5563" stroke-width="1"/>

  <text x="20" y="54" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">J2: 10-PIN 2.54mm UNIVERSAL HEADER</text>
  <g font-family="monospace" font-size="10" fill="#e5e7eb">
    <text x="20" y="72">1: VTREF (1.8-5V In)    2: VTARG_OUT (3.3V Sw)</text>
    <text x="20" y="88">3: GND                  4: SWCLK / TCK (GP2)</text>
    <text x="20" y="104">5: GND                  6: SWDIO / TMS (GP3)</text>
    <text x="20" y="120">7: JTAG_TDI (GP4)       8: JTAG_TDO (GP5)</text>
    <text x="20" y="136">9: TARGET_NRST (GP7)   10: CH32_SWIO (GP8)</text>
  </g>

  <text x="330" y="54" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold">J3: 10-PIN 1.27mm ARM</text>
  <g font-family="monospace" font-size="10" fill="#e5e7eb">
    <text x="330" y="72">1: VTREF     2: SWDIO</text>
    <text x="330" y="88">3: GND       4: SWCLK</text>
    <text x="330" y="104">5: GND       6: TDO/SWO</text>
    <text x="330" y="120">7: KEY       8: TDI</text>
    <text x="330" y="136">9: GND      10: NRST</text>
  </g>

  <line x1="18" y1="152" x2="532" y2="152" stroke="#4b5563" stroke-width="1"/>
  <text x="20" y="170" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">RGB LED STATUS CODES</text>
  <g font-family="monospace" font-size="10" fill="#e5e7eb">
    <text x="20" y="188">GREEN SOLID : Idle / Ready         BLUE BLINK  : SWD / JTAG Active</text>
    <text x="20" y="204">CYAN BLINK  : CH32V003 SWIO Active AMBER PULSE : Recovery / Unbrick</text>
    <text x="20" y="220">RED FAST    : VTARG Overcurrent FAULT Latched (Check Target Short)</text>
  </g>
</svg>
